# Usuario del sistema con el que se ejecutan los procesos de Nginx.
user nginx;

# Número de procesos worker ('auto' = uno por CPU).
worker_processes auto;

# Bloque 'events': cómo maneja Nginx las conexiones a bajo nivel.
events {
    # Número máximo de conexiones simultáneas por worker.
    worker_connections 1024;
}

# Bloque principal HTTP: TODO lo relativo al servidor web / reverse proxy va
# DENTRO de este bloque.
http {
    # Tipos MIME por defecto (text/html, image/png, etc.).
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================
    # Configuración de logs
    # ==========================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ==========================
    # Ajustes generales
    # ==========================

    # Envío eficiente de archivos estáticos con sendfile() del SO.
    sendfile on;

    # Tiempo máximo de una conexión keep-alive abierta esperando nuevas
    # peticiones.
    keepalive_timeout 65;

    # Tamaño máximo del cuerpo de la petición (por defecto 1 MB).
    # Lo subimos para que se puedan subir imágenes de las regiones.
    client_max_body_size 10M;

    # ==========================
    # Definición del backend
    # ==========================

    # Grupo de servidores backend: el contenedor de Spring Boot en el puerto
    # 8080.
    # 'ticket-logger-app' es el nombre del servicio en docker-compose.
    upstream ticket_logger_backend {
        server ticket-logger-app:8080;
    }

    # ==========================
    # Servidor HTTP (puerto 80)
    # ==========================

    # Solo redirige todo el tráfico a HTTPS.
    server {
        listen 80;
        server_name localhost;

        # http://localhost/lo-que-sea → https://localhost/lo-que-sea
        return 301 https://$host$request_uri;
    }

    # ==========================
    # Servidor HTTPS (puerto 443)
    # ==========================

    server {
        listen 443 ssl;
        server_name localhost;

        # Certificado y clave privada generados por docker-entrypoint.sh.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Solo TLS 1.2 y 1.3.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Cifrados permitidos.
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ==========================
        # Reglas de enrutamiento
        # ==========================

        # 'location' tiene que ir DENTRO del 'server' al que pertenece.
        location / {
            # Reenviamos la petición a Spring Boot.
            proxy_pass http://ticket_logger_backend;

            # Cabeceras con información del cliente original.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Nginx termina TLS: hacia el backend va en HTTP, pero indicamos
            # que el cliente usó HTTPS (para redirecciones y URLs absolutas).
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
