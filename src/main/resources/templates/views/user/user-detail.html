<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{msg.user-detail.title})}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card form-card-wide text-start">
        <h1 th:text="#{msg.user-detail.title}"></h1>

        <dl class="row mt-3">
            <dt class="col-sm-5" th:text="#{msg.user-list.id}"></dt>
            <dd class="col-sm-7" th:text="${user.id}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.email}"></dt>
            <dd class="col-sm-7" th:text="${user.email}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.active}"></dt>
            <dd class="col-sm-7" th:text="${user.active} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.accountNonLocked}"></dt>
            <dd class="col-sm-7" th:text="${user.accountNonLocked} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.lastPasswordChange}"></dt>
            <dd class="col-sm-7" th:text="${#temporals.format(user.lastPasswordChange, 'dd/MM/yyyy HH:mm')}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.passwordExpiresAt}"></dt>
            <dd class="col-sm-7" th:text="${#temporals.format(user.passwordExpiresAt, 'dd/MM/yyyy HH:mm')}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.failedLoginAttempts}"></dt>
            <dd class="col-sm-7" th:text="${user.failedLoginAttempts}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.emailVerified}"></dt>
            <dd class="col-sm-7" th:text="${user.emailVerified} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <dt class="col-sm-5" th:text="#{msg.user-form.mustChangePassword}"></dt>
            <dd class="col-sm-7" th:text="${user.mustChangePassword} ? #{msg.common.yes} : #{msg.common.no}"></dd>

            <!-- UD04-5: Roles del usuario -->
            <dt class="col-sm-5" th:text="#{msg.user-detail.field.roles}">Roles</dt>
            <dd class="col-sm-7">
                <span th:if="${#sets.isEmpty(user.roles)}" class="text-muted"
                      th:text="#{msg.user-detail.field.roles.empty}"></span>
                <span th:each="role : ${user.roles}" class="badge text-bg-dark me-1"
                      th:text="${role.displayName}" th:title="${role.name}"></span>
            </dd>
        </dl>

        <!-- ───────────────────────────── -->
        <!-- SECCIÓN: Perfil de Usuario (UD04-4) -->
        <!-- ───────────────────────────── -->
        <div class="mt-4">
            <h2 class="h5" th:text="#{msg.user-detail.section.profileData}">Perfil del usuario</h2>

            <!-- Si NO hay datos de perfil (todos los campos de perfil son null) -->
            <div th:if="${user.firstName == null and user.lastName == null and user.phoneNumber == null and
                         user.profileImage == null and user.bio == null and user.locale == null}"
                 class="alert alert-info"
                 th:text="#{msg.user-detail.profile.empty}">
                Este usuario no tiene perfil asociado.
            </div>

            <!-- Si SÍ hay algún dato de perfil -->
            <div th:if="${user.firstName != null or user.lastName != null or user.phoneNumber != null or
                         user.profileImage != null or user.bio != null or user.locale != null}">
                <dl class="row">
                    <dt class="col-sm-5" th:text="#{msg.user-detail.profile.field.profileImage}"></dt>
                    <dd class="col-sm-7">
                        <div th:if="${user.profileImage == null}">
                            <span class="text-muted" th:text="#{msg.user-detail.profile.noImage}"></span>
                        </div>
                        <div th:if="${user.profileImage != null}">
                            <img th:src="@{${user.profileImage}}" alt="Foto perfil" class="img-thumbnail rounded"
                                 style="max-width: 150px;"/>
                        </div>
                    </dd>

                    <dt class="col-sm-5" th:text="#{msg.user-detail.profile.field.firstName}"></dt>
                    <dd class="col-sm-7" th:text="${user.firstName}"></dd>

                    <dt class="col-sm-5" th:text="#{msg.user-detail.profile.field.lastName}"></dt>
                    <dd class="col-sm-7" th:text="${user.lastName}"></dd>

                    <dt class="col-sm-5" th:text="#{msg.user-detail.profile.field.phoneNumber}"></dt>
                    <dd class="col-sm-7" th:text="${user.phoneNumber}"></dd>

                    <dt class="col-sm-5" th:text="#{msg.user-detail.profile.field.locale}"></dt>
                    <dd class="col-sm-7" th:text="${user.locale}"></dd>

                    <dt class="col-sm-5" th:text="#{msg.user-detail.profile.field.bio}"></dt>
                    <dd class="col-sm-7" th:text="${user.bio}"></dd>
                </dl>
            </div>
        </div>

        <a th:href="@{/users/edit(id=${user.id})}" class="btn btn-primary" th:text="#{msg.user-list.edit}"></a>
        <a th:href="@{/users}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}"></a>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
